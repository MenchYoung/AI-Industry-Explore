<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="澄明企业研究院——面向中美企业的中英双语财务研究与产业分析系统。">
  <meta name="theme-color" content="#6658e8"><title>澄明企业研究院</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#dashboard" data-nav="dashboard"><span class="brand-mark">澄</span><span><b>澄明企业研究院</b><small>企业财务与产业研究</small></span></a>
    <nav id="mainNav" aria-label="主导航">
      <button data-nav="dashboard" class="active"><i>⌂</i><span>研究总览</span></button>
      <button data-nav="companies"><i>◇</i><span>公司档案</span></button>
      <button data-nav="financials"><i>≡</i><span>财务数据</span></button>
      <button data-nav="analytics"><i>⌁</i><span>财务分析</span></button>
      <button data-nav="comparison"><i>⇄</i><span>同行比较</span><em>CORE</em></button>
      <button data-nav="journal"><i>✎</i><span>研究日志</span></button>
      <button data-nav="settings"><i>⚙</i><span>数据管理</span></button>
    </nav>
    <div class="sidebar-foot"><span class="status-dot"></span><div><b>本地数据</b><small>数据保存在当前浏览器</small></div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><button class="mobile-menu" id="mobileMenu" aria-label="打开导航">☰</button><div><p id="breadcrumb">澄明研究院 / 研究总览</p><h1 id="pageTitle">研究总览</h1></div><div class="top-actions"><button class="ghost" id="globalSearchBtn">⌕ 搜索</button><button class="primary" data-action="add-financial">＋ 录入财务数据</button></div></header>
    <main id="app" tabindex="-1"></main>
  </div>
  <dialog id="modal"><div class="modal-card"><header><div><p class="eyebrow" id="modalEyebrow">NEW RECORD</p><h2 id="modalTitle">新增</h2></div><button type="button" data-close class="icon-btn" aria-label="关闭">×</button></header><div id="modalBody"></div></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div><input type="file" id="importFile" accept="application/json" hidden>
  <script src="./research-seed.js"></script>
  <script src="./amd-research-seed.js"></script>
  <script src="./broadcom-research-seed.js"></script>
  <script src="./marvell-research-seed.js"></script>
  <script src="./intel-research-seed.js"></script>
  <script src="./arm-research-seed.js"></script>
  <script src="./cambricon-research-seed.js"></script>
  <script src="./app.js"></script>
  <script>
    document.title = '澄明企业研究院';
    const syncChineseBrand = () => {
      const breadcrumb = document.getElementById('breadcrumb');
      if (breadcrumb && breadcrumb.textContent.includes('YHH RESEARCH')) {
        breadcrumb.textContent = breadcrumb.textContent.replace('YHH RESEARCH', '澄明研究院');
      }
    };
    syncChineseBrand();
    new MutationObserver(syncChineseBrand).observe(document.body, {subtree: true, childList: true, characterData: true});
  </script>
</body></html>
